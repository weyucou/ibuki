repos:
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.2
    hooks:
      - id: check-metaschema
        name: Validate JSON Schemas against the Draft 2020-12 meta-schema
        files: ^schema/.*\.schema\.json$
      - id: check-jsonschema
        name: Validate reference template against the proposal schema
        files: ^templates/proposal\.example\.json$
        args:
          - --schemafile
          - schema/v0.2.0/proposal.schema.json
      - id: check-jsonschema
        name: Validate the v0.1.0 fixture against the v0.1.0 proposal schema
        files: ^tests/fixtures/proposal\.v0\.1\.0\.json$
        args:
          - --schemafile
          - schema/v0.1.0/proposal.schema.json

  - repo: local
    hooks:
      - id: check-projection-table
        name: Check the role/field table against the canonical projection map
        entry: python3 scripts/check_projection_table.py
        language: system
        pass_filenames: false
        files: ^(docs/agent-consumption\.md|schema/v0\.2\.0/(role-projections|proposal\.schema)\.json)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
